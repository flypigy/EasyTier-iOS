name: macOS Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: EasyTier
  BUILD_CONFIGURATION: Release
  APP_ZIP: EasyTier-macos-arm64.zip
  EASYTIER_VERSION: v2.6.4

jobs:
  build-macos-arm64:
    name: Build macOS arm64 app
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode and install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/derived" >> "${GITHUB_ENV}"
          echo "APP_PATH=${RUNNER_TEMP}/derived/Build/Products/Release/EasyTier.app" >> "${GITHUB_ENV}"
          echo "EXPORT_PATH=${RUNNER_TEMP}/export" >> "${GITHUB_ENV}"

          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

          rustup target add aarch64-apple-darwin
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi

          rustc --version
          protoc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Core

      - name: Download official easytier-core binary
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${EASYTIER_VERSION}"
          ZIP_URL="https://github.com/EasyTier/EasyTier/releases/download/${VERSION}/easytier-macos-aarch64-${VERSION}.zip"
          curl -sSfL "${ZIP_URL}" -o "${RUNNER_TEMP}/easytier-core.zip"
          mkdir -p "${RUNNER_TEMP}/easytier-core-pkg"
          unzip -o "${RUNNER_TEMP}/easytier-core.zip" -d "${RUNNER_TEMP}/easytier-core-pkg"

          CORE_BINARY="$(find "${RUNNER_TEMP}/easytier-core-pkg" -type f -name easytier-core | head -n 1)"
          test -n "${CORE_BINARY}" || { echo "easytier-core not found in release zip"; exit 1; }
          cp -f "${CORE_BINARY}" "EasyTier/easytier-core"
          chmod +x "EasyTier/easytier-core"
          codesign --force --sign - --timestamp=none "EasyTier/easytier-core"

          CLI_BINARY="$(find "${RUNNER_TEMP}/easytier-core-pkg" -type f -name easytier-cli | head -n 1)"
          test -n "${CLI_BINARY}" || { echo "easytier-cli not found in release zip"; exit 1; }
          cp -f "${CLI_BINARY}" "EasyTier/easytier-cli"
          chmod +x "EasyTier/easytier-cli"
          codesign --force --sign - --timestamp=none "EasyTier/easytier-cli"

          file "EasyTier/easytier-core" "EasyTier/easytier-cli"

      - name: Build Release app for macOS arm64
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild build \
            -project EasyTier.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIGURATION}" \
            -destination "generic/platform=macOS" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

          test -f "${APP_PATH}/Contents/Resources/easytier-core" \
            || { echo "easytier-core resource missing from app bundle"; ls -la "${APP_PATH}/Contents/Resources"; exit 1; }
          test -f "${APP_PATH}/Contents/Resources/easytier-cli" \
            || { echo "easytier-cli resource missing from app bundle"; ls -la "${APP_PATH}/Contents/Resources"; exit 1; }
          file "${APP_PATH}/Contents/Resources/easytier-core" "${APP_PATH}/Contents/Resources/easytier-cli"
          file "${APP_PATH}/Contents/MacOS/EasyTier"

      - name: Ad-hoc sign app for local use
        shell: bash
        run: |
          set -euo pipefail

          TUNNEL_PATH="${APP_PATH}/Contents/PlugIns/EasyTierNetworkExtension.appex"
          WIDGET_PATH="${APP_PATH}/Contents/PlugIns/EasyTierWidgetExtension.appex"
          ENTITLEMENTS="${RUNNER_TEMP}/EasyTier.macos.entitlements"

          # Ad-hoc signatures cannot carry provisioning-restricted entitlements
          # (com.apple.developer.*); keep only the app group so the app still
          # launches on Apple Silicon. Re-sign with a real identity to enable
          # the packet tunnel provider.
          cat > "${ENTITLEMENTS}" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.cn.easytier</string>
            </array>
          </dict>
          </plist>
          EOF

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements "${ENTITLEMENTS}" \
            "${WIDGET_PATH}"
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements "${ENTITLEMENTS}" \
            "${TUNNEL_PATH}"
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements "${ENTITLEMENTS}" \
            "${APP_PATH}"

          codesign --verify --deep --strict "${APP_PATH}"
          spctl -a -t exec "${APP_PATH}" || true

      - name: Package app zip
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${EXPORT_PATH}"
          ditto -c -k --keepParent "${APP_PATH}" "${EXPORT_PATH}/${APP_ZIP}"
          shasum -a 256 "${EXPORT_PATH}/${APP_ZIP}" > "${EXPORT_PATH}/${APP_ZIP}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EasyTier-macos-arm64-${{ github.run_number }}
          path: ${{ runner.temp }}/export/EasyTier-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Update rolling macOS release
        if: github.repository_owner == 'flypigy'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_NOTES="${RUNNER_TEMP}/macos-release-notes.md"

          {
            echo "Automated Release build for macOS (Apple Silicon, arm64) from [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "- Build configuration: \`${BUILD_CONFIGURATION}\`, arch: \`arm64\`"
            echo "- Bundles the official \`easytier-core\` (${EASYTIER_VERSION}) for the local core mode: the tunnel runs as a root LaunchDaemon instead of NetworkExtension, so the VPN works without Apple Developer signing."
            echo "- On first connect, macOS asks for the administrator password once to install the service; later connects/disconnects need no password."
            echo "- Local core mode fetches status via a loopback-only RPC portal (127.0.0.1:15888): virtual IP, NAT type, IP lists, version and the peer list work. The event timeline and the widget status are not available in this mode."
            echo "- Remove the quarantine attribute before first launch: \`xattr -cr EasyTier.app\`"
            echo "- Uninstall the service with:"
            echo "  \`sudo launchctl bootout system/cn.easytier.core; sudo rm -f /Library/LaunchDaemons/cn.easytier.core.plist; sudo rm -rf \"/Library/Application Support/EasyTier\"\`"
            echo "- Built: ${BUILD_TIME}"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > "${RELEASE_NOTES}"

          git tag --force macos "${GITHUB_SHA}"
          git push --force origin refs/tags/macos

          if gh release view macos >/dev/null 2>&1; then
            gh release edit macos \
              --target "${GITHUB_SHA}" \
              --title "EasyTier macOS (arm64, ${SHORT_SHA})" \
              --notes-file "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false
            gh release upload macos \
              "${EXPORT_PATH}/${APP_ZIP}" \
              "${EXPORT_PATH}/${APP_ZIP}.sha256" \
              --clobber
          else
            gh release create macos \
              "${EXPORT_PATH}/${APP_ZIP}" \
              "${EXPORT_PATH}/${APP_ZIP}.sha256" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "EasyTier macOS (arm64, ${SHORT_SHA})" \
              --notes-file "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false
          fi
